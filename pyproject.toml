[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vliw-branch-sim"
version = "0.1.0"
description = "Synthetic VLIW branch-prediction experiments with relative energy and cycle models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "matplotlib>=3.6"]

[project.scripts]
vliw-sim = "branch_prediction_sim.cli:main"

[tool.setuptools.packages.find]
include = ["branch_prediction_sim*"]
